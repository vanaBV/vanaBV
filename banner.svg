<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" shape-rendering="crispEdges">
  <defs>
    <pattern id="g" x="0" y="0" width="20" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="4" height="15" fill="#5CD838"/>
      <rect x="13" y="7" width="4" height="11" fill="#48B828"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="900" height="230" fill="#88C8F0"/>

  <!-- Sun (top left) -->
  <rect x="36" y="16" width="40" height="40" fill="#FFD700"/>
  <rect x="52" y="4"  width="8"  height="10" fill="#FFD700"/>
  <rect x="52" y="58" width="8"  height="10" fill="#FFD700"/>
  <rect x="24" y="32" width="10" height="8"  fill="#FFD700"/>
  <rect x="78" y="32" width="10" height="8"  fill="#FFD700"/>
  <rect x="29" y="10" width="8"  height="8"  fill="#FFD700"/>
  <rect x="75" y="10" width="8"  height="8"  fill="#FFD700"/>
  <rect x="29" y="54" width="8"  height="8"  fill="#FFD700"/>
  <rect x="75" y="54" width="8"  height="8"  fill="#FFD700"/>
  <rect x="44" y="24" width="8"  height="8"  fill="#FFEC70"/>

  <!-- Cloud 1 (left-center) -->
  <rect x="216" y="28" width="16" height="8" fill="white"/>
  <rect x="208" y="36" width="40" height="8" fill="white"/>
  <rect x="200" y="44" width="56" height="8" fill="white"/>
  <rect x="208" y="52" width="40" height="8" fill="white"/>
  <rect x="216" y="52" width="24" height="4" fill="#CCE4F4"/>

  <!-- Cloud 2 (right) -->
  <rect x="660" y="20" width="24" height="8" fill="white"/>
  <rect x="652" y="28" width="48" height="8" fill="white"/>
  <rect x="644" y="36" width="64" height="8" fill="white"/>
  <rect x="652" y="44" width="48" height="8" fill="white"/>
  <rect x="660" y="44" width="32" height="4" fill="#CCE4F4"/>

  <!-- Mushroom (left, MapleStory style) -->
  <rect x="154" y="143" width="16" height="8"  fill="#CC4422"/>
  <rect x="146" y="151" width="32" height="8"  fill="#CC4422"/>
  <rect x="146" y="159" width="32" height="8"  fill="#CC4422"/>
  <rect x="150" y="167" width="24" height="8"  fill="#CC4422"/>
  <rect x="150" y="155" width="5"  height="5"  fill="white"/>
  <rect x="165" y="152" width="5"  height="5"  fill="white"/>
  <rect x="154" y="175" width="16" height="8"  fill="#E8D090"/>

  <!-- Tree (right) -->
  <rect x="796" y="138" width="16" height="8"  fill="#3A8820"/>
  <rect x="790" y="146" width="28" height="8"  fill="#3A8820"/>
  <rect x="786" y="154" width="36" height="8"  fill="#3A8820"/>
  <rect x="786" y="162" width="36" height="8"  fill="#3A8820"/>
  <rect x="790" y="170" width="28" height="8"  fill="#3A8820"/>
  <rect x="798" y="178" width="12" height="10" fill="#7A4010"/>

  <!-- Ground tufts -->
  <rect x="0" y="167" width="900" height="18" fill="url(#g)"/>

  <!-- Grass surface -->
  <rect x="0" y="183" width="900" height="6" fill="#62E044"/>
  <rect x="0" y="187" width="900" height="4" fill="#4DC934"/>
  <rect x="0" y="191" width="900" height="4" fill="#3AAA20"/>

  <!-- Ground body -->
  <rect x="0" y="195" width="900" height="35" fill="#3AAA20"/>
  <rect x="0" y="207" width="900" height="4"  fill="#2E8A18"/>
  <rect x="0" y="219" width="900" height="4"  fill="#226614"/>
  <rect x="0" y="227" width="900" height="3"  fill="#1A5010"/>

  <!-- Title text (drawn last = always on top) -->
  <text x="450" y="106"
        font-family="'Courier New', Courier, monospace"
        font-weight="bold"
        font-size="42"
        fill="white"
        stroke="#1A3A1A"
        stroke-width="3"
        paint-order="stroke"
        text-anchor="middle"
        letter-spacing="4">[ vanaBV ]</text>
  <text x="450" y="139"
        font-family="'Courier New', Courier, monospace"
        font-weight="bold"
        font-size="16"
        fill="#FFEC6A"
        stroke="#3A2800"
        stroke-width="2"
        paint-order="stroke"
        text-anchor="middle"
        letter-spacing="1">Game Developer  ·  Roblox  ·  Indie</text>
</svg>
